name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python and Rego verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      GATEWAY_DATABASE: ':memory:'
      OPA_VERSION: '1.12.2'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install and verify OPA
        run: |
          opa_dir="$RUNNER_TEMP/opa-bin"
          opa_path="$opa_dir/opa"
          mkdir -p "$opa_dir"
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            --proto '=https' \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static" \
            --output "$opa_path"
          printf '%s  %s\n' 'a4ba8734ed95ceaac850c12684a42467ed6b0dc9633a9db8dd14d47d05e37751' "$opa_path" \
            | sha256sum --check --strict
          chmod 0755 "$opa_path"
          version_output=$("$opa_path" version)
          printf '%s\n' "$version_output"
          test "$(awk '$1 == "Version:" { print $2 }' <<< "$version_output")" = "$OPA_VERSION"
          printf '%s\n' "$opa_dir" >> "$GITHUB_PATH"
          printf 'OPA_TEST_BINARY=%s\n' "$opa_path" >> "$GITHUB_ENV"

      - name: Verify Rego policies
        run: |
          opa check --strict policies/
          opa test policies/ -v

      - name: Run the complete pytest suite
        run: |
          test -x "$OPA_TEST_BINARY"
          python -m pytest -q

      - name: Run Python static and dependency checks
        run: |
          python -m ruff check --select E4,E7,E9,F app config tests verification
          python -m mypy --explicit-package-bases app config verification
          python -m compileall -q app config tests verification
          python -m pip check
